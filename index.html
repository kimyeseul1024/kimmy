<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 광주은광교회 초등2부 교회소식</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background-color: #f4f6f9;
      color: #333;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      max-width: 600px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    .badge {
      display: inline-block;
      background: #e8f0fe;
      color: #1a73e8;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #111;
    }
    p.subtitle {
      font-size: 15px;
      color: #666;
      margin-bottom: 28px;
    }
    .info-box {
      background: #f8f9fa;
      border-left: 4px solid #1a73e8;
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    .info-box h2 {
      font-size: 16px;
      margin-bottom: 8px;
      color: #222;
    }
    .info-box ul {
      list-style: none;
      font-size: 14px;
      color: #555;
    }
    .info-box ul li {
      margin-bottom: 6px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #1a73e8;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 14px;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1557b0;
    }
    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">온 세상에 복음을 전해요!</span>
    <h1>또 이르시되 너희는 온 천하에 다니며 만민에게 복음을 전파하라(마가복음 16장 15절)</h1>
    <p class="subtitle">교회 소식 전합니다!</p>

    <div class="info-box">
      <h2>주요 안내 사항</h2>
      <ul>
        <li>• <strong>1</strong> 추수감사주일 "한 해 동안 하나님 주신 은혜를 생각하며 감사합시다."</li>
        <li>• <strong>2</strong> 하반기 제자훈련 11/8~29(주일, 4회) 수료 시 국내비전트립 참가 자격 부여</li>
        <li>• <strong>3</strong> 전라어린이대회가 11/21(토) 우리 교회, 출전하는 친구들 모두 파이팅!</li>
      </ul>
    </div>

    <!-- 이동할 링크가 있다면 href="#"의 # 대신 주소를 넣으세요 -->
    <a href="#" class="btn">자세히 보기 / 신청하기</a>

    <footer>
      © 2026 All Rights Reserved.
    </footer>
  </div>

</body>
</html>
