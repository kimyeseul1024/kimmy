      z-index: 100;
    }

      width: 100%;
      padding: 20px;
      border-radius: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .close-btn {

      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .modal-content img {

      border-radius: 8px;
      margin-bottom: 10px;
    }
