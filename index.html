<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>특수교육 학술 및 연구 자료실</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>특수교육 연구 & 자료 아카이브</h1>
            <p>지적장애, 시각장애·청각장애 교육 및 에비던스 기반 교수 전략 자료실</p>
        </div>
    </header>

    <main class="container">
        <!-- 검색 및 필터 바 -->
        <section class="filter-section">
            <input type="text" id="searchInput" placeholder="자료 제목이나 키워드를 검색하세요...">
        </section>

        <!-- 자료 목록 카드 그리드 -->
        <section class="archive-grid">
            <article class="card" data-category="paper">
                <span class="tag">학술논문</span>
                <h2>지적장애 학생을 위한 분수 개념 지도: 나선형 확장 모델 적용 연구</h2>
                <p class="meta">발행년도: 2026 | 학회 발표 자료</p>
                <a href="assets/papers/sample.pdf" class="btn" target="_blank">PDF 다운로드 / 보기</a>
            </article>

            <article class="card" data-category="lecture">
                <span class="tag">강의 교안</span>
                <h2>청각·시각장애학생 교육 개론 및 심리측정 이해</h2>
                <p class="meta">대상: 대학 학부 및 대학원 과정</p>
                <a href="assets/handouts/sample.pdf" class="btn" target="_blank">자료 보기</a>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; Special Education Archive. Hosted on GitHub Pages.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
