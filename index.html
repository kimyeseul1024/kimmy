<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 광주은광교회 초등2부 교회소식</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #e2e8f0);
      color: #333;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container {
      background: #ffffff;
      max-width: 600px;
      width: 100%;
      padding: 36px 28px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
    }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #1e293b;
    }
    p.subtitle {
      font-size: 15px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 24px;
    }
    .info-box {
      background: #f8fafc;
      border-left: 5px solid #3b82f6;
      padding: 18px 20px;
      border-radius: 14px;
      margin-bottom: 24px;
    }
    .info-box h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #1e3a8a;
    }
    .info-box ul {
      list-style: none;
      font-size: 14px;
      color: #334155;
    }
    .info-box ul li {
      margin-bottom: 8px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      padding: 15px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
    }
    .btn:hover {
      background: #2563eb;
    }
    footer {
      margin-top: 26px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">✨ 온 세상에 복음을 전해요!</span>
    <h1>또 이르시되 너희는 온 천하에 다니며 만민에게 복음을 전파하라 (마가복음 16장 15절)</h1>
    <p class="subtitle">2026 광주은광교회 초등2부 교회 소식</p>

    <div class="info-box">
      <h2>📢 주요 안내 사항</h2>
      <ul>
        <li>• <strong>1. 추수감사주일</strong> </li>
        <li>• <strong>2. 하반기 제자훈련</strong> 11/8~29(주일, 4회) 수료 시 국내비전트립 참가 자격 부여</li>
        <li>• <strong>3. 전라어린이대회</strong> 11/21(토) 우리 교회, 출전하는 친구들 내일 예배 후 모임, 비전홀</li>
      </ul>
    </div>

    <div class="btn-group">
      <a href="#" class="btn">교회소식 확인하기</a>
    </div>

    <footer>
      © 2026 yeseuly. All Rights Reserved.
    </footer>
  </div>

</body>
</html>
